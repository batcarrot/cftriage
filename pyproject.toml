[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cftriage"
version = "0.1.0"
description = "Counterfactual demographic testing of LLM emergency triage, with noise-aware statistics"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]
license = {text = "MIT"}

[project.optional-dependencies]
litellm = ["litellm"]

[project.scripts]
cftriage = "cftriage.cli:main"

[tool.setuptools]
packages = ["cftriage"]

[tool.setuptools.package-data]
cftriage = ["webui.html"]
